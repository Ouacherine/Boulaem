<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges A.B.E</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a47">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --navy:#0b2a47; --cyan:#08b6cf; --teal:#1f7f93; --ink:#16212b; --mute:#6b7c88;
  --line:#dbe3e8; --bg:#eef3f6; --card:#ffffff;
  font-family:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}
.app{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:32px;max-width:960px;margin:0 auto;padding:32px 20px}
h1{font-size:1.4rem;margin:0 0 4px;color:var(--navy)}
.sub{margin:0 0 20px;color:var(--mute);font-size:.95rem}
form{background:var(--card);padding:20px;border-radius:14px;display:grid;gap:14px;border:1px solid var(--line)}
label{display:grid;gap:6px;font-size:.9rem;color:var(--mute)}
input,select{font:inherit;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--cyan);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px;background:var(--navy);color:#fff;cursor:pointer}
button:hover{background:#12406a}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
button.dl{background:var(--cyan);color:var(--navy);padding:12px 22px}
button.dl:hover{background:#26c6dd}
button.dl:disabled{opacity:.6;cursor:wait}
.hint{color:var(--mute);font-size:.9rem;margin:0}
.empty{width:320px;height:510px;border:2px dashed var(--line);border-radius:22px;display:grid;place-items:center;color:var(--mute);text-align:center;padding:30px}

/* Badge */
.flip{width:320px;height:510px;perspective:1200px;cursor:pointer;display:none;border:0;padding:0;background:none}
.flip.on{display:block}
.inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.back .inner{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 14px 34px rgba(11,42,71,.22);text-align:center}
.face.verso{transform:rotateY(180deg)}
.tri{position:absolute;width:0;height:0}
.t1{top:66px;left:0;border-top:190px solid var(--navy);border-right:120px solid transparent}
.t2{top:66px;right:0;border-top:210px solid var(--cyan);border-left:120px solid transparent}
.t3{bottom:0;left:0;border-bottom:130px solid var(--cyan);border-right:125px solid transparent}
.t4{bottom:0;right:0;border-bottom:150px solid var(--navy);border-left:120px solid transparent}
.head{position:absolute;top:34px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;height:34px;background:#fff;z-index:2;font-weight:700;font-size:13px;color:var(--navy)}
.head img{height:36px;width:36px;object-fit:contain}
.head b{color:var(--teal)}
.photo{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:160px;height:160px;border-radius:50%;background:#fff;padding:7px;box-shadow:0 6px 16px rgba(0,0,0,.14);z-index:2}
.photo div{width:100%;height:100%;border-radius:50%;background:#cfd9df center/cover no-repeat}
.name{position:absolute;top:268px;left:30px;right:30px;background:var(--navy);color:#fff;border-radius:30px;padding:9px 8px;font-size:19px;font-weight:700;z-index:2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spec{position:absolute;top:316px;left:50%;transform:translateX(-50%);background:var(--cyan);color:var(--navy);font-weight:700;font-size:13px;padding:7px 24px;border-radius:20px;z-index:2;white-space:nowrap}
.grid{position:absolute;top:366px;left:34px;right:34px;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;text-align:left;z-index:2}
.grid div{border-bottom:2px solid #e3e9ec;padding-bottom:6px;min-width:0}
.grid small{display:block;font-size:11px;font-weight:700;color:var(--mute)}
.grid span{display:block;font-size:17px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.v-top{position:absolute;top:50px;left:18px;right:18px;height:122px;background:#fff;border-radius:0 0 12px 12px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.v-top img{height:62px}
.v-top strong{font-size:16px;color:var(--navy)}
.v-top em{font-style:normal;font-weight:700;color:var(--teal);font-size:13px}
.contacts{position:absolute;top:196px;left:24px;right:24px;z-index:2;border-top:2px solid #e3e9ec;border-bottom:2px solid #e3e9ec;padding:12px 0;display:grid;gap:6px;font-size:13px;color:var(--navy);font-weight:700}
.rules{position:absolute;top:290px;left:24px;right:24px;z-index:2;background:#ecf8fa;border-left:4px solid var(--cyan);padding:10px 12px;text-align:left;font-size:11px;color:var(--mute);line-height:1.45}
.rules b{display:block;color:var(--teal);font-size:11px;margin-bottom:4px}
.qrs{position:absolute;bottom:14px;left:14px;right:14px;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qrs div{background:#fff;border:2px solid #e3e9ec;border-radius:12px;padding:6px 6px 4px;font-size:12px;font-weight:700;color:var(--teal)}
.qrs img{width:68%;display:block;margin:0 auto 2px}

@media (max-width:760px){.app{grid-template-columns:1fr}}
@media print{body{background:#fff}form,h1,.sub,.hint,.dl{display:none}.app{display:block;padding:0}.stage{flex-direction:row;gap:10mm}.flip{display:block!important;width:54mm;height:86mm}.inner{transform:none!important;transform-style:flat}.face{position:relative;box-shadow:none;backface-visibility:visible}.face.verso{transform:none}}
</style>
</head>
<body>
<div class="app">
  <section>
    <h1>Générateur de badges</h1>
    <p class="sub">Remplissez la fiche, puis cliquez sur « Générer le badge ».</p>
    <form id="form">
      <label>Photo
        <input type="file" id="photo" accept="image/*">
      </label>
      <label>Nom et prénom
        <input id="name" required placeholder="ex. Ilyes Ouacherine">
      </label>
      <div class="row">
        <label>Spécialité
          <select id="spec"></select>
        </label>
        <label>Groupe
          <select id="group"></select>
        </label>
      </div>
      <label>Date de naissance
        <input type="date" id="birth" required>
      </label>
      <div class="row">
        <label>ID
          <input id="id" required inputmode="numeric">
        </label>
        <label>Saison
          <input id="season" required value="2026/2027">
        </label>
      </div>
      <button type="submit">Générer le badge</button>
    </form>
  </section>

  <section class="stage">
    <div class="empty" id="empty">Le badge apparaîtra ici après la génération.</div>
    <button type="button" class="flip" id="flip" aria-label="Retourner le badge">

<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script>
// Listes modifiables
const SPECIALTIES = ["Sanda"];
const GROUPS = ["Poussin","Minime","Cadet","Junior","Senior"];

const $ = id => document.getElementById(id);
const fill = (el, list) => list.forEach(v => el.add(new Option(v, v)));
fill($("spec"), SPECIALTIES);
fill($("group"), GROUPS);

// ID automatique (001, 002...) mémorisé dans le navigateur
const pad = n => String(n).padStart(3, "0");
let next = 1;
try { next = parseInt(localStorage.getItem("abe-next-id") || "1", 10) || 1; } catch (e) {}
$("id").value = pad(next);

let photoURL = "";
$("photo").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { photoURL = r.result; };
  r.readAsDataURL(f);
});

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const [y, m, d] = $("birth").value.split("-");
  $("o-name").textContent = $("name").value.trim();
  $("o-spec").textContent = "Spécialité : " + $("spec").value;
  $("o-birth").textContent = `${d}/${m}/${y}`;
  $("o-group").textContent = $("group").value;
  $("o-id").textContent = $("id").value.trim();
  $("o-season").textContent = $("season").value.trim();
  $("o-photo").style.backgroundImage = photoURL ? `url("${photoURL}")` : "none";

  $("empty").style.display = "none";
  $("flip").classList.add("on");
  $("flip").classList.remove("back");
  $("hint").hidden = false;
  $("dl").hidden = false;

  // Prépare l'ID suivant
  const n = parseInt($("id").value, 10);
  if (!isNaN(n)) {
    try { localStorage.setItem("abe-next-id", String(n + 1)); } catch (e) {}
    $("id").value = pad(n + 1);
  }
});

$("flip").addEventListener("click", () => $("flip").classList.toggle("back"));

// Téléchargement PDF : page 1 = recto, page 2 = verso (54 x 86 mm)
async function snap(face) {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-10000px;top:0;width:320px;height:510px";
  const c = face.cloneNode(true);
  c.style.cssText = "position:absolute;inset:0;transform:none;backface-visibility:visible;-webkit-backface-visibility:visible;box-shadow:none";
  box.appendChild(c);
  document.body.appendChild(box);
  try {
    const canvas = await html2canvas(c, { scale: 4, backgroundColor: null, useCORS: true });
    return canvas.toDataURL("image/png");
  } finally { box.remove(); }
}

$("dl").addEventListener("click", async () => {
  const btn = $("dl");
  btn.disabled = true;
  btn.textContent = "Création du PDF…";
  try {
    const recto = await snap(document.querySelector(".face.recto"));
    const verso = await snap(document.querySelector(".face.verso"));
    const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: [54, 86] });
    pdf.addImage(recto, "PNG", 0, 0, 54, 86);
    pdf.addPage([54, 86], "portrait");
    pdf.addImage(verso, "PNG", 0, 0, 54, 86);
    const nom = $("o-name").textContent.trim().replace(/[^\p{L}\p{N}]+/gu, "-") || "badge";
    pdf.save("badge-" + nom + ".pdf");
  } catch (err) {
    alert("Le PDF n'a pas pu être créé : " + (err && err.message ? err.message : err));
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Télécharger le PDF";
  }
});

</script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
